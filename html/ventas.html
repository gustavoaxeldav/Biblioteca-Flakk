<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Flakk | Ventas</title>

    <link rel="stylesheet" href="../css/biblioteca.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<header>

    <div class="logo">
        <img src="../img/logo.png" alt="Logo">
        <h2>Biblioteca Flakk</h2>
    </div>

    <button type="button" onclick="modoDaltonismo()">
        <i class="fa-solid fa-eye"></i>
        Modo Daltonismo
    </button>

    <nav>

        <a href="../php/menu.php">
            🏠 Inicio
        </a>

        <a href="../php/catalogo.php">
            📚 Catálogo
        </a>

        <a href="almacen.html">
            📦 Inventario
        </a>

    </nav>

</header>

<main>

    <section class="ventas">

        <h1>Registrar venta</h1>

        <div class="formulario">

            <label for="libroVenta">Libro</label>

            <select id="libroVenta">
            </select>

            <label for="cantidad">Cantidad</label>

            <input
                type="number"
                id="cantidad"
                min="1"
                value="1"
            >

            <label for="cliente">Cliente (opcional)</label>

            <input
                type="text"
                id="cliente"
                placeholder="Nombre del cliente"
            >

            <button
                type="button"
                onclick="registrarVenta()"
            >
                <i class="fa-solid fa-cart-shopping"></i>
                Registrar venta
            </button>

        </div>

    </section>

    <section class="historial">

        <h2>Historial de ventas</h2>

        <table>

            <thead>
                <tr>
                    <th>Libro</th>
                    <th>Cantidad</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                </tr>
            </thead>

            <tbody id="tablaVentas">
            </tbody>

        </table>

    </section>

</main>

<footer>
    Biblioteca Flakk © 2026
</footer>

<script src="../js/biblioteca.js?v=26"></script>

</body>
</html>
