<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biblioteca Flakk | Agregar Libro</title>

    <link rel="stylesheet" href="biblioteca.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<header>

    <div class="logo">
        <img
            src="logo.png"
            alt="Logo"
            class="logo-img"
        >

        <h2>Biblioteca Flakk</h2>
    </div>

    <button type="button" onclick="modoDaltonismo()">
        <i class="fa-solid fa-eye"></i>
        Modo Daltonismo
    </button>

    <nav>
        <a href="menu.php">
            <i class="fa-solid fa-house"></i>
            Inicio
        </a>

        <a href="catalogo.php">
            <i class="fa-solid fa-book"></i>
            Catálogo
        </a>

        <a href="almacen.html">
            <i class="fa-solid fa-boxes-stacked"></i>
            Inventario
        </a>
    </nav>

</header>

<main>

    <section class="formulario">

        <h1>Agregar nuevo libro</h1>

        <div class="form">

            <div class="input-box">
                <label for="titulo">Título del libro</label>

                <input
                    type="text"
                    id="titulo"
                    required
                >
            </div>

            <div class="input-box">
                <label for="autor">Autor</label>

                <input
                    type="text"
                    id="autor"
                    required
                >
            </div>

            <div class="input-box">
                <label for="categoria">Categoría</label>

                <select id="categoria">

                    <option value="Infantil">Infantil</option>
                    <option value="Terror">Terror</option>
                    <option value="Romance">Romance</option>
                    <option value="Historia">Historia</option>
                    <option value="Fantasía">Fantasía</option>

                    <option value="Ciencia Ficción">
                        Ciencia Ficción
                    </option>

                    <option value="Misterio">Misterio</option>
                    <option value="Escolar">Escolar</option>

                </select>
            </div>

            <div class="input-box">
                <label for="precio">Precio</label>

                <input
                    type="number"
                    id="precio"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <div class="input-box">
                <label for="stock">Cantidad</label>

                <input
                    type="number"
                    id="stock"
                    min="0"
                    required
                >
            </div>

            <div class="input-box">
                <label for="imagen">
                    URL de la portada (opcional)
                </label>

                <input
                    type="url"
                    id="imagen"
                    placeholder="https://..."
                >
            </div>

            <button
                type="button"
                onclick="agregarLibro()"
            >
                <i class="fa-solid fa-floppy-disk"></i>
                Guardar libro
            </button>

        </div>

    </section>

</main>

<footer>
    Biblioteca Flakk © 2026
</footer>

<script src="biblioteca.js"></script>

</body>
</html>
