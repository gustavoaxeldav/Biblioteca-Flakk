<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Flakk | Inicio</title>

    <link rel="stylesheet" href="css/biblioteca.css">
</head>

<body class="login-page">

<header>
    <div class="logo">
        <img src="img/logo.png" alt="Logo">
        <h2>Biblioteca Flakk</h2>
    </div>
</header>

<main class="contenedor">

    <div class="imagen">
        <img src="logo.png" alt="Biblioteca Flakk">
    </div>

    <section class="login">

        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>

        <form action="login.php" method="POST">

            <div class="input-box">
                <label for="usuario">Usuario</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    required
                >
            </div>

            <div class="input-box">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <button type="submit">Iniciar sesión</button>

        </form>

        <button
            type="button"
            class="secundario"
            onclick="modoDaltonismo()"
        >
            Modo daltonismo
        </button>

        <p>
            ¿No tienes cuenta?
            <a href="registro.html">Regístrate aquí</a>
        </p>

    </section>

</main>

<footer>
    Biblioteca Flakk © 2026
</footer>

<script src="js/biblioteca.js"></script>

</body>
</html>
